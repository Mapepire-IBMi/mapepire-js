name: 🚀 Feature Request
description: Submit a proposal for a new feature or enhancement
labels: ['enhancement']

body:
  - type: textarea
    attributes:
      label: 🚀 The feature, motivation and pitch
      description: >
        A clear and concise description of the feature proposal. Please outline the motivation for the proposal. Is your feature request related to a specific problem? e.g., *"I'm working on X and would like Y to be possible"*. If this is related to another GitHub issue, please link here too.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Which transport mode(s) does this affect?
      options:
        - WebSocket
        - SSH Single
        - Local Single
        - All transports
        - Not transport-specific
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed TypeScript API (optional)
      description: A rough interface or usage example showing how you would like to use the feature.
      render: typescript
  - type: textarea
    attributes:
      label: Alternatives considered
      description: >
        A description of any alternative solutions or features you've considered, if any.
  - type: textarea
    attributes:
      label: Additional context
      description: >
        Add any other context or screenshots about the feature request.
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
