name: 🐛 Bug Report
description: Create a report to help us reproduce and fix the bug
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting a bug, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/Mapepire-IBMi/mapepire-js/issues?q=is%3Aissue+sort%3Acreated-desc+).
  - type: textarea
    attributes:
      label: 🐛 Describe the bug
      description: |
        Please provide a clear and concise description of what the bug is.

        If relevant, add a minimal example so that we can reproduce the error by running the code. Please keep it as short as possible and include the relevant imports. Never include real credentials.
      placeholder: |
        A clear and concise description of what the bug is.

        ```ts
        import { SQLJob } from "@ibm/mapepire-js";

        const job = new SQLJob();
        // Use environment variables — never hardcode credentials
        await job.connect({ host: process.env.DB2_HOST, user: process.env.DB2_USER, password: process.env.DB2_PASS });
        const result = await job.execute("select * from sample.employee");
        console.log(result);
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Connect using ...
        2. Run the query ...
        3. See the error ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead? If there is an error, paste the **full** message and stack trace.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Transport mode
      description: Which transport were you using?
      options:
        - WebSocket (daemon)
        - SSH Single
        - Local Single
        - Unknown / Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: |
        Please run the following and paste the output below, and also include your IBM i OS version (e.g. V7R4, V7R5).
        ```sh
        node -e "const {VERSION}=require('@ibm/mapepire-js');console.log(VERSION)"
        node --version
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the problem here.
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
